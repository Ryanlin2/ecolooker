version: 0.2

env:
  variables:
    S3_BUCKET: ecolooker
    WHEEL_PREFIX: python-wheels/imf
    PYTHON_VERSION: "3.11"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install build awscli

  pre_build:
    commands:
      - echo "Building IMF wheel for commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - rm -rf dist build *.egg-info

  build:
    commands:
      - python -m build --wheel
      - ls -lah dist/

  post_build:
    commands:
      - WHEEL_FILE=$(ls dist/*.whl | head -n 1)
      - WHEEL_NAME=$(basename "$WHEEL_FILE")
      - S3_PATH="s3://${S3_BUCKET}/${WHEEL_PREFIX}/${CODEBUILD_RESOLVED_SOURCE_VERSION}/${WHEEL_NAME}"
      - echo "Uploading $WHEEL_FILE to $S3_PATH"
      - aws s3 cp "$WHEEL_FILE" "$S3_PATH"
      - echo "$S3_PATH" > wheel_s3_path.txt

artifacts:
  files:
    - dist/*.whl
    - wheel_s3_path.txt
  discard-paths: yes